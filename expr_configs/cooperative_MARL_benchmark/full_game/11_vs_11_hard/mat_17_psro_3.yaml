expr_group: gr_football
expr_name: benchmark_full_game_11_v_11_hard_mat_17_psro_3
log_dir: ./logs
seed: 0
eval_only: False

distributed:
  use: False
  auto_connect:
  auto_copy:
  nodes:
    master:
      ip: "auto"
    workers:
      - ip:

framework:
  name: "psro"
  max_rounds: 5                         # 改: 1 → 5（PSRO多轮）
  meta_solver: "nash"
  sync_training: True
  stopper:
    type: "win_rate_stopper"
    kwargs:
      min_win_rate: 0.95                 # 改: 1.0 → 0.6（self-play中胜率趋近0.5，阈值不能高）
      max_steps: 800                    # 改: 1000 → 600（每轮600步，5轮共3000步）

agent_manager:
  num_agents: 2
  share_policies: True                  # 改: False → True（启用self-play核心）

evaluation_manager:
  num_eval_rollouts: 1

policy_data_manager:
  update_func: "gr_football"
  fields:
    payoff:
      type: "matrix"
      missing_value: -100
    score:
      type: "matrix"
      missing_value: -100
    win:
      type: "matrix"
      missing_value: -100
    lose:
      type: "matrix"
      missing_value: -100
    my_goal:
      type: "matrix"
      missing_value: -100
    goal_diff:
      type: "matrix"
      missing_value: -100

monitor:
  type: "local"
  distributed:
    resources:
      num_cpus: 1
      resources:
        - ["node:${distributed.nodes.master.ip}",0.01]

rollout_manager:
  distributed:
    resources:
      num_cpus: 1
      resources:
        - ["node:${distributed.nodes.master.ip}",0.01]
  num_workers: 60
  seed: 12345
  saving_interval: 100
  batch_size: ${rollout_manager.num_workers}
  eval_batch_size: 100
  eval_freq: 100
  rollout_metric_cfgs:
    reward:
      type: "sliding"
      window_size: 20
      init_list: [-10000]
    win:
      type: "sliding"
      window_size: 20
      init_list: [0,0,0,0,0]
  worker:
    distributed:
      resources:
        num_cpus: 1
    rollout_length: 3001
    eval_rollout_length: 3001
    sample_length: 0
    padding_length:
    rollout_func_name: "rollout_func"
    episode_mode: 'traj'
    envs:
      - cls: "gr_football"
        id_prefix: "gr_footbal"
        scenario_config:
          env_name: "benchmark_full_game_11_vs_11_hard"
          number_of_left_players_agent_controls: 10
          number_of_right_players_agent_controls: 10   # 改: 1 → 10（对称10v10，self-play必需）
          representation: "raw"
          rewards: "scoring,checkpoints"
          stacked: False
          logdir: '/tmp/football/malib_psro'
          write_goal_dumps: False
          write_full_episode_dumps: False
          render: False
          other_config_options:
            action_set: v2
        reward_config:
          goal_reward: 0
          official_reward: 1
    credit_reassign:
    decaying_exploration:
      init_noise: 0
      total_epoch_to_zero: 2000
      interval: 400


training_manager:
  distributed:
    resources:
      num_cpus: 1
      resources:
        - ["node:${distributed.nodes.master.ip}",0.01]

  master_addr: "127.0.0.1"
  master_port: "12780"                  # 改: 12774 → 12780（避免与mat_17等实验端口冲突）
  local_queue_size: 1
  batch_size: ${rollout_manager.batch_size}
  num_prefetchers: 1
  data_prefetcher:
    distributed:
      resources:
        num_cpus: 1
  num_trainers: 1
  update_interval: 1
  gpu_preload: False
  trainer:
    distributed:
      resources:
        num_cpus: 1
        num_gpus: 1
        resources:
          - ["node:${distributed.nodes.master.ip}",0.01]
    optimizer: "Adam"
    actor_lr: 5.e-4
    critic_lr: 5.e-4
    backbone_lr: 5.e-4
    opti_eps: 1.e-5
    weight_decay: 0.0
    lr_decay: False
    lr_decay_epoch: 2000

data_server:
  distributed:
    resources:
      num_cpus: 1
      resources:
        - ["node:${distributed.nodes.master.ip}",0.01]
  table_cfg:
    capacity: 1000
    sampler_type: "lumrf"
    sample_max_usage: 1
    rate_limiter_cfg:
      min_size: ${training_manager.batch_size}
  read_timeout: 1

policy_server:
  distributed:
    resources:
      num_cpus: 1
      resources:
        - ["node:${distributed.nodes.master.ip}",0.01]

populations:
  - population_id: default
    algorithm:
      name: "MAPPO"
      model_config:
        model: "gr_football.basic_mat"
        backbone:
          num_agents: 10
          embed_dim: 256
          num_blocks: 1
          num_heads: 2
          encode_state: False
        actor:
          dec_actor: False
          share_actor: False
        critic:
        initialization:
          use_orthogonal: True
          gain: 1.

      custom_config:
        FE_cfg:
          num_players: 22
        gamma: 0.995
        use_cuda: False
        use_q_head: False
        ppo_epoch: 10
        num_mini_batch: 1

        return_mode: new_gae
        gae:
          gae_lambda: 0.95
        vtrace:
          clip_rho_threshold: 1.0
          clip_pg_rho_threshold: 100.0

        use_rnn: False
        rnn_layer_num: 1
        rnn_data_chunk_length: 16

        use_feature_normalization: True
        use_popart: True
        popart_beta: 0.99999

        entropy_coef: 0.0001
        clip_param: 0.2
        max_grad_norm: 5

        use_modified_mappo: False

      # 改: 整段重构 policy_init_cfg
      # 1) 移除原有 agent_1（share_policies=True 时只需 agent_0）
      # 2) round 0 用 mat_17 训练好的模型作起点（方案B核心）
      # 3) 后续轮次继承上一轮最优策略
      policy_init_cfg:
        agent_0:
          new_policy_ctr_start: -1
          init_cfg:
            - condition: "==0"                                                                                  # round 0：用 mat_17 模型作起点（不再随机）
              strategy: random
              policy_id:
              policy_dir:
            - condition: "default"                                                                              # round >0：继承上一轮最优
              strategy: inherit_last_best
              policy_id:
              policy_dir:
          initial_policies:                                                                                     # 初始种群：保留游戏AI作参考对手（用于Nash计算和eval对比）
            - policy_id: built_in_11
              policy_dir: light_malib/trained_models/gr_football/11_vs_11/built_in
